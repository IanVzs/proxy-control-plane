<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代理控制平面</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>代理控制平面</h1>
            <nav>
                <button class="nav-btn active" data-tab="providers">代理提供商</button>
                <button class="nav-btn" data-tab="services">服务配置</button>
                <button class="nav-btn" data-tab="proxy">代理测试</button>
            </nav>
        </header>

        <main>
            <section id="providers" class="tab-content active">
                <div class="header">
                    <h2>代理提供商管理</h2>
                    <button class="btn btn-primary" id="addProviderBtn">添加提供商</button>
                </div>
                <div class="table-container">
                    <table id="providersTable">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>类型</th>
                                <th>地址</th>
                                <th>支持国家</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="providersBody">
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="services" class="tab-content">
                <div class="header">
                    <h2>服务配置</h2>
                    <button class="btn btn-primary" id="addServiceBtn">添加服务</button>
                </div>
                <div class="table-container">
                    <table id="servicesTable">
                        <thead>
                            <tr>
                                <th>服务名称</th>
                                <th>关联代理</th>
                                <th>今日使用</th>
                                <th>总请求</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="servicesBody">
                        </tbody>
                    </table>
                </div>
            </section>

            <section id="proxy" class="tab-content">
                <div class="header">
                    <h2>代理测试</h2>
                </div>
                <div class="proxy-test">
                    <div class="form-group">
                        <label>目标URL</label>
                        <input type="text" id="proxyUrl" placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label>服务名称（可选）</label>
                        <input type="text" id="proxyServiceName" placeholder="service-name">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>国家（可选）</label>
                            <input type="text" id="proxyCountry" placeholder="CN, US, HK...">
                        </div>
                        <div class="form-group">
                            <label>区域（可选）</label>
                            <input type="text" id="proxyRegion" placeholder="region">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>会话ID（可选）</label>
                            <input type="text" id="proxySession" placeholder="session-id">
                        </div>
                        <div class="form-group">
                            <label>代理时长（可选）</label>
                            <input type="text" id="proxyDuration" placeholder="1, 5, 10...">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>提供商ID（可选）</label>
                        <input type="text" id="proxyProviderId" placeholder="provider-id">
                    </div>
                    <div class="form-group">
                        <label>请求方法</label>
                        <select id="proxyMethod">
                            <option value="GET">GET</option>
                            <option value="POST">POST</option>
                            <option value="PUT">PUT</option>
                            <option value="DELETE">DELETE</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="testProxyBtn">测试代理</button>
                    <div id="proxyResult" class="result-box"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal" id="providerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="providerModalTitle">添加代理提供商</h2>
                <span class="close" data-modal="providerModal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="providerForm">
                    <input type="hidden" id="providerId">
                    <div class="form-group">
                        <label>名称</label>
                        <input type="text" id="providerName" required>
                    </div>
                    <div class="form-group">
                        <label>类型</label>
                        <select id="providerType">
                            <option value="http">HTTP</option>
                            <option value="https">HTTPS</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>主机</label>
                            <input type="text" id="providerHost" required>
                        </div>
                        <div class="form-group">
                            <label>端口</label>
                            <input type="number" id="providerPort" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户名 <small style="color:#666">支持: {country} {region} {session} {duration}</small></label>
                            <input type="text" id="providerUsername" required>
                        </div>
                        <div class="form-group">
                            <label>密码 <small style="color:#666">支持: {country} {region} {session} {duration}</small></label>
                            <input type="password" id="providerPassword" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>支持国家（逗号分隔，留空表示全部）</label>
                        <input type="text" id="providerCountries" placeholder="CN, US, HK, JP">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="providerEnabled" checked>
                            启用
                        </label>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="providerModal">取消</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="serviceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="serviceModalTitle">添加服务</h2>
                <span class="close" data-modal="serviceModal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="serviceForm">
                    <div class="form-group">
                        <label>服务名称</label>
                        <input type="text" id="serviceName" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="serviceModal">取消</button>
                        <button type="submit" class="btn btn-primary">创建</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="serviceConfigModal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h2 id="serviceConfigTitle">服务配置</h2>
                <span class="close" data-modal="serviceConfigModal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="service-config-header">
                    <h3 id="configServiceName"></h3>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>
                            <input type="checkbox" id="configServiceEnabled">
                            启用服务
                        </label>
                    </div>
                </div>
                
                <div class="section-divider">
                    <h4>关联代理提供商</h4>
                    <button type="button" class="btn btn-sm btn-primary" id="addProviderToServiceBtn">添加代理</button>
                </div>
                
                <div id="serviceProvidersList" class="providers-list"></div>
                
                <div class="section-divider">
                    <h4>今日使用统计</h4>
                </div>
                <div id="todayUsageList" class="usage-list"></div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="serviceConfigModal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addProviderToServiceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加代理到服务</h2>
                <span class="close" data-modal="addProviderToServiceModal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addProviderToServiceForm">
                    <div class="form-group">
                        <label>选择代理提供商</label>
                        <select id="selectProviderForService" required>
                            <option value="">请选择...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>权重</label>
                        <input type="number" id="providerWeight" value="1" min="1" required>
                        <small style="color:#666">权重越高，被选中的概率越大</small>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="addProviderToServiceModal">取消</button>
                        <button type="submit" class="btn btn-primary">添加</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
